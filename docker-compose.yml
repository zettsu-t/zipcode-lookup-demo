services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/data:/app/data:ro
    environment:
      DATA_DIR: data

  frontend:
    build: ./frontend
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8001
      SECRET_KEY: docker-secret-key
      DEBUG: "false"
    depends_on:
      - backend
