openapi: 3.1.0
info:
  title: はがき配布サービス バックエンドAPI
  version: '2.1'
paths:
  /api/v1/zip:
    get:
      summary: 郵便番号→住所の順引き
      operationId: get_zip_api_v1_zip_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{7}$|^[0-9]{3}-[0-9]{4}$
          description: 郵便番号。ハイフンあり（NNN-NNNN）またはなし（NNNNNNN）
          examples:
          - '2310017'
          - 231-0017
          title: Code
        description: 郵便番号。ハイフンあり（NNN-NNNN）またはなし（NNNNNNN）
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZipcodeResult'
        '400':
          description: 郵便番号のフォーマットが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: 該当する郵便番号なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/address:
    get:
      summary: 住所→郵便番号の逆引き
      operationId: get_address_api_v2_address_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          description: 検索クエリ。2文字以上。ワイルドカード * 使用可
          title: Q
        description: 検索クエリ。2文字以上。ワイルドカード * 使用可
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResult'
                title: Response Get Address Api V2 Address Get
        '400':
          description: クエリが短すぎる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddressResult:
      properties:
        zipcode:
          type: string
          title: Zipcode
        address:
          type: string
          title: Address
        type:
          type: string
          title: Type
      type: object
      required:
      - zipcode
      - address
      - type
      title: AddressResult
    ErrorDetail:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorDetail
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ZipcodeResult:
      properties:
        zipcode:
          type: string
          title: Zipcode
        address:
          type: string
          title: Address
      type: object
      required:
      - zipcode
      - address
      title: ZipcodeResult
