[project]
name = "frontend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.9",
]
