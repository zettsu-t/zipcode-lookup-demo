[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["routers*", "services*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "schemathesis>=3.38",
]
